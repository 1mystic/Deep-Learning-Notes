  <script>
    /* Apply the saved theme before first paint (no flash). */
    (function () {
      var saved = null;
      try { saved = JSON.parse(localStorage.getItem('mg:theme')); } catch (e) {}
      var pref = saved || (window.SITE_CONFIG && SITE_CONFIG.defaultTheme) || 'system';
      var dark = pref === 'dark' || (pref === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.content = dark ? '#222224' : '#f8f9f8';
    })();
  </script>
  <link rel="preload" href="assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
